[package]
name = "redeem"
version = "0.1.0"
description = "Created with Anchor"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "redeem"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
# FIX: Synchronized Anchor versions to the stable 0.30.1 branch
anchor-lang = "1.0.1"
anchor-spl = "1.0.1"

[dev-dependencies]
# REMOVED: litesvm and solana-v3 crates from here.
# If you are testing with TypeScript (standard), you don't need these in Rust.
# They are the ones causing the 'zeroize' version conflict.

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }